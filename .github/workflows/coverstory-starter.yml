name: CoverStory starter checks

on:
  push:
    branches: [main, review/integration/fde-main-reconciliation, review/fde-coursework-v2-sprint3, review/fde-coursework-v2-sprint4-repair, learning/coverstory-day-02-30, learning/coverstory-beyond-30, learning/coverstory-days-31-44, learning/coverstory-days-45-56, learning/coverstory-days-57-70, learning/coverstory-days-71-84, docs/coverstory-days-31-84-course-guidance, learning/coverstory-days-85-98, learning/coverstory-days-99-112, learning/coverstory-days-113-126, learning/coverstory-days-127-140, learning/coverstory-days-141-154, learning/streamforge-days-155-168, learning/streamforge-days-169-182, learning/streamforge-days-183-196]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for the Day 44 and Day 45 transport harnesses
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify PostgreSQL 18.6 backup client tools
        run: |
          docker pull postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          docker run --rm --network host --entrypoint pg_dump postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 --version
          docker run --rm --network host --entrypoint pg_restore postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 --version
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Build isolated local frontend
        working-directory: frontend
        run: npm run build:local
      - name: Package isolated Spring Boot app
        run: ./mvnw -B -ntp -Plocal-app -DskipTests clean package
      - name: Verify Java infrastructure and instructor harness
        run: ./mvnw -B -ntp test
      - name: Verify continuation manifest
        run: python3 -m unittest scripts/test_continuation_113_126_manifest.py scripts/test_continuation_127_140_manifest.py
      - name: Verify DSA and StreamForge roadmap manifests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify StreamForge local fixture infrastructure
        run: python3 -m unittest ai.streamforge.tests.test_infrastructure ai.streamforge.tests.test_evaluation_infrastructure ai.streamforge.tests.test_evaluation_adapter ai.streamforge.tests.test_content_infrastructure ai.streamforge.tests.test_content_cli.ContentManifestPreflightTest scripts.test_streamforge_183_196_manifest
      - name: Frontend instructor tests
        working-directory: frontend
        run: npm test
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=low
