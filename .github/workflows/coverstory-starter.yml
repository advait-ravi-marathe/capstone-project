name: CoverStory starter checks

on:
  push:
    branches: [main, learning/coverstory-day-02-30, learning/coverstory-beyond-30]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Java infrastructure and instructor harness
        run: ./mvnw -B -ntp test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend instructor tests
        working-directory: frontend
        run: npm test
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=low
