name: AWS FDE v2.4 starter checks

on:
  push:
    branches: [main, work/aws-fde-v24-continuation, chore/align-repo-to-fde-v24, feature/production-ml-depth-extension]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked React dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React application
        working-directory: frontend
        run: npm run build
      - name: Run active frontend tests
        working-directory: frontend
        run: npm test
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Install pinned CPU-only Sprint 1 dependencies
        run: |
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1'
          python3 -m pip install -r requirements-fde-v2-sprint1.txt
      - name: Install pinned local Qdrant dependencies
        run: python3 -m pip install -r requirements-fde-v2-sprint2.txt
      - name: Verify active first-month curriculum and API
        run: |
          python3 -m unittest scripts.test_fde_v2_sprint1 scripts.test_fde_v2_sprint2
          FDE_V2_CANDIDATE=ai.fde_v2.coverstory.reference python3 -m unittest \
            ai.fde_v2.learner_acceptance.test_units \
            ai.fde_v2.learner_acceptance.test_continuation_units
          python3 -m unittest ai.fde_v2.tests.test_sprint1 ai.fde_v2.tests.test_sprint1_witnesses
          python3 -m unittest ai.fde_v2.tests.test_continuation_witnesses \
            ai.fde_v2.tests.test_continuation_api ai.fde_v2.tests.test_local_pipeline_witness
          python3 -m ai.fde_v2.coverstory.day01_baseline
          python3 scripts/fde_v2_container_smoke.py
      - name: Verify M2.1–M2.2 local security and lifecycle
        run: |
          python3 -m unittest scripts.test_fde_v2_p1_closeout scripts.test_fde_v2_m21_draft scripts.test_fde_v2_m22_draft
          python3 -m unittest ai.fde_v2.tests.test_m21_draft ai.fde_v2.tests.test_m21_feature_integration \
            ai.fde_v2.tests.test_m22_draft ai.fde_v2.tests.test_m22_integration \
            ai.fde_v2.tests.test_evidence_receipts
          python3 -m ai.fde_v2.m22.acceptance --milestone AIFDE-V2-M2.2 --mode integration
          M22_CANDIDATE=ai.fde_v2.m22.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m22_units
      - name: Install pinned official MCP SDK
        run: python3 -m pip install -r requirements-fde-v2-mcp.txt
      - name: Verify M2.3–M3.2 provider scaffolds and real MCP stdio
        run: |
          python3 -m unittest scripts.test_fde_v2_m23_m32 \
            ai.fde_v2.tests.test_m23_draft ai.fde_v2.tests.test_m31_draft \
            ai.fde_v2.tests.test_m32_draft ai.fde_v2.tests.test_m32_stdio
          M23_CANDIDATE=ai.fde_v2.m23.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m23_units
          M31_CANDIDATE=ai.fde_v2.m31.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m31_units
          M32_CANDIDATE=ai.fde_v2.m32.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m32_units
      - name: Verify M3.3–M4.2 operational mechanics
        run: |
          python3 -m unittest scripts.test_fde_v2_m33_m42 \
            ai.fde_v2.tests.test_m33 ai.fde_v2.tests.test_m41 ai.fde_v2.tests.test_m42
          M33_CANDIDATE=ai.fde_v2.m33.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m33_units
          M41_CANDIDATE=ai.fde_v2.m41.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m41_units
          M42_CANDIDATE=ai.fde_v2.m42.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m42_units
      - name: Verify M4.3–M5.3 scaffolds and 270-day inventory
        run: |
          python3 -m unittest scripts.test_fde_v2_m43_m53 \
            ai.fde_v2.tests.test_m43 ai.fde_v2.tests.test_m51 \
            ai.fde_v2.tests.test_m52 ai.fde_v2.tests.test_m53
          M43_CANDIDATE=ai.fde_v2.m43.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m43_units
          M51_CANDIDATE=ai.fde_v2.m51.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m51_units
          M52_CANDIDATE=ai.fde_v2.m52.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m52_units
          M53_CANDIDATE=ai.fde_v2.m53.reference python3 -m unittest ai.fde_v2.learner_acceptance.test_m53_units
      - name: Verify DSA repository remains separate
        run: python3 -m unittest scripts.test_external_track_boundary
      - name: Verify versioned production-ML extension and route overlay
        run: |
          python3 -m pip install -r requirements-fde-v2-ml.txt
          python3 -m unittest scripts.test_fde_v2_ml_depth scripts.test_fde_v2_query_plan_lab ai.fde_v2.ml_depth.test_ml_depth
          ML_DEPTH_CANDIDATE=ai.fde_v2.ml_depth.reference python3 -m unittest ai.fde_v2.ml_depth.learner_acceptance
          python3 -m ai.fde_v2.ml_depth.examples --block PML1
          python3 -m ai.fde_v2.ml_depth.examples --block PML2
          python3 -m ai.fde_v2.ml_depth.examples --block PML3
          python3 -m ai.fde_v2.ml_depth.examples --block PML4
