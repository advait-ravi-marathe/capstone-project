server.address=127.0.0.1
server.port=${COVERSTORY_APP_PORT:8080}

spring.datasource.url=${COVERSTORY_DB_URL:jdbc:postgresql://127.0.0.1:55432/coverstory_local}
spring.datasource.username=${COVERSTORY_DB_USER:coverstory}
spring.datasource.password=${COVERSTORY_DB_PASSWORD:local-training-only}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.pool-name=coverstory-local
spring.datasource.hikari.connection-timeout=1000
spring.flyway.enabled=true

# Local demo only: read-only endpoints; /metrics is session-protected and meter-filtered.
management.endpoints.web.exposure.include=health,metrics
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
