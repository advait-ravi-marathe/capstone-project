services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: coverstory_local
      POSTGRES_USER: coverstory
      POSTGRES_PASSWORD: ${COVERSTORY_DB_PASSWORD:?generated by scripts/local-demo.sh}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverstory -d coverstory_local"]
      interval: 2s
      timeout: 2s
      retries: 30
